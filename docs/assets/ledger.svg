<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" width="820" height="400" role="img" aria-labelledby="ledger-title ledger-desc" font-family="'Iosevka','SFMono-Regular',Consolas,monospace">
  <title id="ledger-title">Cairn performance ledger: a cache MISS then HIT</title>
  <desc id="ledger-desc">A terminal window showing a first run that misses the cache and executes the command, followed by a second run that hits the cache and restores outputs. A ledger records the two events.</desc>

  <defs>
    <linearGradient id="term" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2f34"/>
      <stop offset="1" stop-color="#1f2226"/>
    </linearGradient>
    <style>
      .chrome{ fill:#3f4349; }
      .txt   { fill:#e6eaef; font-size:13px; }
      .dim   { fill:#8b9099; font-size:13px; }
      .amber { fill:#d9a441; font-size:13px; }
      .ice   { fill:#8fd0e8; font-size:13px; }
      .miss  { fill:#e0975a; font-size:13px; font-weight:bold; }
      .hit   { fill:#7fc9a0; font-size:13px; font-weight:bold; }
      .head  { fill:#f4ede0; font-size:12px; letter-spacing:1px; }
      @media (prefers-reduced-motion: reduce){
        .ln,.cur,.bar1,.bar2{ animation:none !important; opacity:1 !important; }
      }
      .ln{ opacity:0; animation:show .01s linear forwards; }
      .l1{animation-delay:.3s} .l2{animation-delay:.9s} .l3{animation-delay:1.5s}
      .l4{animation-delay:2.4s} .l5{animation-delay:3.0s} .l6{animation-delay:3.6s}
      @keyframes show{to{opacity:1}}
      .cur{ animation:blink 1s step-end infinite; }
      @keyframes blink{50%{opacity:0}}
      .bar1{ transform:scaleX(0); transform-origin:left; animation:grow1 1.2s ease-out 2s forwards; }
      .bar2{ transform:scaleX(0); transform-origin:left; animation:grow2 1s ease-out 3.8s forwards; }
      @keyframes grow1{to{transform:scaleX(1)}}
      @keyframes grow2{to{transform:scaleX(.06)}}
    </style>
  </defs>

  <!-- terminal window -->
  <rect x="20" y="20" width="500" height="360" rx="8" fill="url(#term)" stroke="#4a4f56"/>
  <rect x="20" y="20" width="500" height="28" rx="8" class="chrome"/>
  <circle cx="40" cy="34" r="5" fill="#d9a441"/>
  <circle cx="58" cy="34" r="5" fill="#8b9099"/>
  <circle cx="76" cy="34" r="5" fill="#8fd0e8"/>
  <text x="260" y="38" text-anchor="middle" class="dim" font-size="11">cairn-run: field session</text>

  <text x="38" y="76"  class="ln l1"><tspan class="amber">$</tspan> <tspan class="txt">cairn-run --verbose \</tspan></text>
  <text x="38" y="96"  class="ln l1"><tspan class="dim">    --input src.c --output a.o -- cc -c src.c</tspan></text>
  <text x="38" y="122" class="ln l2"><tspan class="miss">cache MISS</tspan> <tspan class="txt">3c9e2f1a55b0d7e4</tspan></text>
  <text x="38" y="142" class="ln l3"><tspan class="dim">stored manifest 3c9e2f1a55b0d7e4 (1 output)</tspan></text>

  <text x="38" y="186" class="ln l4"><tspan class="amber">$</tspan> <tspan class="txt">rm a.o &amp;&amp; cairn-run --verbose \</tspan></text>
  <text x="38" y="206" class="ln l4"><tspan class="dim">    --input src.c --output a.o -- cc -c src.c</tspan></text>
  <text x="38" y="232" class="ln l5"><tspan class="hit">cache HIT</tspan> <tspan class="txt">3c9e2f1a55b0d7e4 (restored 1)</tspan></text>

  <text x="38" y="276" class="ln l6"><tspan class="amber">$</tspan> <tspan class="txt">cairn verify --key 3c9e2f1a55b0d7e4</tspan></text>
  <text x="38" y="296" class="ln l6"><tspan class="ice">1 ok, 0 missing, 0 corrupt, key_matches=true</tspan></text>
  <text x="38" y="316" class="ln l6"><tspan class="hit">OK: cache is healthy</tspan></text>
  <text x="38" y="344"><tspan class="amber">$</tspan> <tspan class="txt cur">▋</tspan></text>

  <!-- ledger panel -->
  <rect x="540" y="20" width="260" height="360" rx="8" fill="#f4ede0" stroke="#c68a2e"/>
