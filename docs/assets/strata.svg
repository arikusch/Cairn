<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" role="img" aria-labelledby="strata-title strata-desc" font-family="'Iosevka','SFMono-Regular',Consolas,monospace">
  <title id="strata-title">Cairn: artifacts descending into content-addressed strata</title>
  <desc id="strata-desc">A cross-section of rock layers. Build artifacts fall from the surface and settle into content-addressed strata, each labelled with an FNV-1a digest shard.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8f1f5"/>
      <stop offset="1" stop-color="#cfe1e8"/>
    </linearGradient>
    <linearGradient id="rock1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9a441"/>
      <stop offset="1" stop-color="#c68a2e"/>
    </linearGradient>
    <linearGradient id="rock2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b8791f"/>
      <stop offset="1" stop-color="#9c6318"/>
    </linearGradient>
    <linearGradient id="rock3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b5f66"/>
      <stop offset="1" stop-color="#3f4349"/>
    </linearGradient>
    <linearGradient id="rock4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#33373d"/>
      <stop offset="1" stop-color="#24272c"/>
    </linearGradient>
    <style>
      .lbl   { fill:#f4ede0; font-size:12px; letter-spacing:.5px; }
      .dig   { fill:#8fd0e8; font-size:11px; letter-spacing:1px; }
      .cap   { fill:#2b2f34; font-size:13px; }
      .sub   { fill:#5b6068; font-size:11px; }
      .blob  { fill:#f4ede0; stroke:#8a5a16; stroke-width:1.2; }
      .icy   { fill:#8fd0e8; }
      @media (prefers-reduced-motion: reduce){
        .drop{ animation:none !important; }
      }
      .drop{ animation:fall 6s cubic-bezier(.5,0,.6,1) infinite; }
